name: CI

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

permissions:
  contents: read

jobs:
  frontend:
    name: Lint e build
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint -- --max-warnings 0

      - name: Verificar build
        run: npm run build
